<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RKDL - Leaderboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header id="hejder">

        <a href="index.html" class="back-button">
            ← RKDL
        </a>

        <p id="R1">Rodzinka</p>
        <p id="R2">Kicka</p>
        <p id="R3">Demon</p>
        <p id="R4">List</p>

    </header>


    <!-- =========================
         LEADERBOARD
    ========================= -->

    <main class="leaderboard-page">

        <div class="leaderboard-title">
            PLAYER LEADERBOARD
        </div>

        <div class="leaderboard-subtitle">
            Ranking based on completed demons
        </div>

        <div id="leaderboard-list">

            <div class="leaderboard-loading">
                Loading players...
            </div>

        </div>

    </main>
<script>
function getPoints(rank) {
    const maxPoints = 1000;
    const minPoints = 1;
    const maxRank = 150;

    const multiplier = Math.pow(
        minPoints / maxPoints,
        1 / (maxRank - 1)
    );

    return Math.round(
        maxPoints * Math.pow(multiplier, rank - 1)
    );
}


async function loadLeaderboard() {
    const container = document.getElementById("leaderboard-list");

    try {
        // Wczytujemy players.json oraz index.html
        const [playersResponse, indexResponse] = await Promise.all([
            fetch("./players.json"),
            fetch("./index.html")
        ]);

        if (!playersResponse.ok) {
            throw new Error("Nie można wczytać players.json");
        }

        if (!indexResponse.ok) {
            throw new Error("Nie można wczytać index.html");
        }

        const players = await playersResponse.json();
        const indexHTML = await indexResponse.text();


        // ==========================================
        // ODCZYTYWANIE DEMONÓW Z index.html
        // ==========================================

        const parser = new DOMParser();
        const indexDocument = parser.parseFromString(
            indexHTML,
            "text/html"
        );

        const demonMap = {};

        indexDocument.querySelectorAll(".demon-card").forEach(card => {

            const id = card.id;

            // np. "top1" -> 1
            const match = id.match(/^top(\d+)$/i);

            if (!match) return;

            const rank = Number(match[1]);

            const nameElement = card.querySelector(".demon-name");

            if (!nameElement) return;

            const name = nameElement.textContent
                .trim()
                .toLowerCase();

            if (!name) return;

            demonMap[name] = rank;
        });


        console.log("Demony znalezione na liście:", demonMap);


        // ==========================================
        // LICZENIE PLAYERÓW
        // ==========================================

        const leaderboard = players.map(player => {

            let totalPoints = 0;
            let completed = 0;
            let bestRank = Infinity;

            let top10 = 0;
            let top25 = 0;
            let top50 = 0;


            if (!Array.isArray(player.Demons)) {
                player.Demons = [];
            }


            player.Demons.forEach(demonName => {

                if (!demonName) return;

                const key = demonName
                    .trim()
                    .toLowerCase();

                const rank = demonMap[key];


                // Nie znaleziono demona na index.html
                if (!rank) {
                    console.warn(
                        `Nie znaleziono "${demonName}" na index.html`
                    );
                    return;
                }


                const points = getPoints(rank);

                totalPoints += points;
                completed++;

                if (rank < bestRank) {
                    bestRank = rank;
                }

                if (rank <= 10) {
                    top10++;
                }

                if (rank <= 25) {
                    top25++;
                }

                if (rank <= 50) {
                    top50++;
                }
            });


            return {
                name: player.Player,
                points: totalPoints,
                completed: completed,
                bestRank: bestRank === Infinity
                    ? "-"
                    : bestRank,
                top10: top10,
                top25: top25,
                top50: top50
            };
        });


        // ==========================================
        // SORTOWANIE
        // ==========================================

        leaderboard.sort((a, b) => {

            if (b.points !== a.points) {
                return b.points - a.points;
            }

            if (b.completed !== a.completed) {
                return b.completed - a.completed;
            }

            return (a.bestRank || 999) - (b.bestRank || 999);
        });


        // ==========================================
        // WYŚWIETLANIE
        // ==========================================

        container.innerHTML = "";


        leaderboard.forEach((player, index) => {

            const row = document.createElement("div");

            row.className = "leaderboard-row";


            row.innerHTML = `
                <div class="leaderboard-position">
                    #${index + 1}
                </div>

                <div class="leaderboard-player">
                    <div class="player-name">
                        ${player.name}
                    </div>

                    <div class="player-info">
                        ${player.completed} DEMONS •
                        BEST TOP ${player.bestRank}
                    </div>
                </div>

                <div class="leaderboard-stats">
                    <div>TOP 10: ${player.top10}</div>
                    <div>TOP 25: ${player.top25}</div>
                    <div>TOP 50: ${player.top50}</div>
                </div>

                <div class="leaderboard-points">
                    <strong>${player.points}</strong>
                    <span>RK</span>
                </div>
            `;


            container.appendChild(row);
        });


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="leaderboard-loading">
                Błąd podczas ładowania leaderboardu.
            </div>
        `;
    }
}


loadLeaderboard();
</script>
</body>
</html>
