<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RKDL - Leaderboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header id="hejder">

        <a href="index.html" class="back-button">
            ← RKDL
        </a>

        <p id="R1">Rodzinka</p>
        <p id="R2">Kicka</p>
        <p id="R3">Demon</p>
        <p id="R4">List</p>

    </header>


    <!-- =========================
         LEADERBOARD
    ========================= -->

    <main class="leaderboard-page">

        <div class="leaderboard-title">
            PLAYER LEADERBOARD
        </div>

        <div class="leaderboard-subtitle">
            Ranking based on completed demons
        </div>

        <div id="leaderboard-list">

            <div class="leaderboard-loading">
                Loading players...
            </div>

        </div>

    </main>

<script>

/* =========================
   SYSTEM PUNKTÓW
========================= */

function getPoints(rank) {

    const maxPoints = 1000;
    const minPoints = 1;
    const maxRank = 150;

    const multiplier = Math.pow(
        minPoints / maxPoints,
        1 / (maxRank - 1)
    );

    return Math.round(
        maxPoints * Math.pow(
            multiplier,
            rank - 1
        )
    );
}


/* =========================
   DEMONY
========================= */

/*
   Na razie wpisujemy tutaj demony,
   które są już na stronie.
*/

const demons = {

    "cobwebs": 1

    // Przykład:
    // "acheron": 2,
    // "slaughterhouse": 3

};


/* =========================
   ZNAJDŹ RANK DEMONA
========================= */

function getDemonRank(demon) {

    const text =
        String(demon)
            .trim()
            .toLowerCase();


    /* =========================
       np. top1 / top 1
    ========================= */

    const topMatch =
        text.match(/^top\s*(\d+)$/);


    if (topMatch) {

        return Number(
            topMatch[1]
        );

    }


    /* =========================
       nazwa demona
    ========================= */

    if (
        demons[text] !== undefined
    ) {

        return demons[text];

    }


    /*
       Nie znaleziono
    */

    console.warn(
        "Nie znaleziono demona:",
        demon
    );

    return null;

}


/* =========================
   LOAD LEADERBOARD
========================= */

async function loadLeaderboard() {

    const leaderboard =
        document.getElementById(
            "leaderboard-list"
        );


    try {

        const response =
            await fetch(
                "./players.json",
                {
                    cache: "no-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const players =
            await response.json();


        if (!Array.isArray(players)) {

            throw new Error(
                "players.json is not an array"
            );

        }


        /* =========================
           OBLICZANIE GRACZY
        ========================= */

        const rankedPlayers =
            players.map(player => {

                const playerDemons =
                    Array.isArray(
                        player.Demons
                    )
                        ? player.Demons
                        : [];


                let totalPoints = 0;

                let bestRank = null;

                let top10 = 0;

                let top25 = 0;

                let top50 = 0;

                let validDemons = 0;


                /* =========================
                   DEMONY GRACZA
                ========================= */

                playerDemons.forEach(
                    demon => {

                        const rank =
                            getDemonRank(
                                demon
                            );


                        /*
                           Nie znaleziono
                        */

                        if (
                            rank === null
                        ) {

                            return;

                        }


                        /*
                           Zły rank
                        */

                        if (
                            rank < 1 ||
                            rank > 150
                        ) {

                            return;

                        }


                        /* =========================
                           PUNKTY
                        ========================= */

                        const points =
                            getPoints(
                                rank
                            );


                        totalPoints +=
                            points;


                        validDemons++;


                        /* =========================
                           BEST TOP
                        ========================= */

                        if (
                            bestRank === null ||
                            rank < bestRank
                        ) {

                            bestRank =
                                rank;

                        }


                        /* =========================
                           TOP 10
                        ========================= */

                        if (
                            rank <= 10
                        ) {

                            top10++;

                        }


                        /* =========================
                           TOP 25
                        ========================= */

                        if (
                            rank <= 25
                        ) {

                            top25++;

                        }


                        /* =========================
                           TOP 50
                        ========================= */

                        if (
                            rank <= 50
                        ) {

                            top50++;

                        }

                    }
                );


                return {

                    name:
                        String(
                            player.Player ||
                            "Unknown"
                        ),

                    demons:
                        validDemons,

                    points:
                        totalPoints,

                    bestRank:
                        bestRank,

                    top10:
                        top10,

                    top25:
                        top25,

                    top50:
                        top50

                };

            });


        /* =========================
           SORTOWANIE
        ========================= */

        rankedPlayers.sort(
            (a, b) => {

                /*
                   Najpierw RK
                */

                if (
                    b.points !==
                    a.points
                ) {

                    return (
                        b.points -
                        a.points
                    );

                }


                /*
                   Potem liczba demonów
                */

                if (
                    b.demons !==
                    a.demons
                ) {

                    return (
                        b.demons -
                        a.demons
                    );

                }


                /*
                   Na końcu najlepszy TOP
                */

                if (
                    a.bestRank === null
                ) {

                    return 1;

                }

                if (
                    b.bestRank === null
                ) {

                    return -1;

                }


                return (
                    a.bestRank -
                    b.bestRank
                );

            }
        );


        /* =========================
           WYCZYŚĆ LOADING
        ========================= */

        leaderboard.innerHTML = "";


        /* =========================
           GENEROWANIE WIERSZY
        ========================= */

        rankedPlayers.forEach(
            (player, index) => {

                const position =
                    index + 1;


                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "leaderboard-row";


                /* TOP 3 */

                if (
                    position === 1
                ) {

                    row.classList.add(
                        "leaderboard-first"
                    );

                }

                else if (
                    position === 2
                ) {

                    row.classList.add(
                        "leaderboard-second"
                    );

                }

                else if (
                    position === 3
                ) {

                    row.classList.add(
                        "leaderboard-third"
                    );

                }


                /* BEST TOP */

                const bestText =
                    player.bestRank !== null

                        ? ` • BEST TOP ${player.bestRank}`

                        : "";


                row.innerHTML = `

                    <div class="leaderboard-position">

                        #${position}

                    </div>


                    <div class="leaderboard-player">

                        <div class="leaderboard-player-name">

                            ${player.name}

                        </div>


                        <div class="leaderboard-player-stats">

                            ${player.demons} DEMONS

                            ${bestText}

                        </div>

                    </div>


                    <div class="leaderboard-tops">

                        <span>
                            TOP 10:
                            ${player.top10}
                        </span>

                        <span>
                            TOP 25:
                            ${player.top25}
                        </span>

                        <span>
                            TOP 50:
                            ${player.top50}
                        </span>

                    </div>


                    <div class="leaderboard-points">

                        ${player.points}

                        <small>RK</small>

                    </div>

                `;


                leaderboard.appendChild(
                    row
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Leaderboard error:",
            error
        );


        leaderboard.innerHTML = `

            <div class="leaderboard-error">

                Failed to load players.json.

            </div>

        `;

    }

}


/* =========================
   START
========================= */

loadLeaderboard();

</script>
</body>
</html>
