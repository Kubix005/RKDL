<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RKDL - Leaderboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header id="hejder">

        <a href="index.html" class="back-button">
            ← RKDL
        </a>

        <p id="R1">Rodzinka</p>
        <p id="R2">Kicka</p>
        <p id="R3">Demon</p>
        <p id="R4">List</p>

    </header>


    <!-- =========================
         LEADERBOARD
    ========================= -->

    <main class="leaderboard-page">

        <div class="leaderboard-title">
            PLAYER LEADERBOARD
        </div>

        <div class="leaderboard-subtitle">
            Ranking based on completed demons
        </div>

        <div id="leaderboard-list">

            <div class="leaderboard-loading">
                Loading players...
            </div>

        </div>

    </main>
<script>


// =====================================================
// USTAWIENIA
// =====================================================

const PLAYERS_URL = "./players.json";
const LEVELS_URL = "./levels.json";


// =====================================================
// PUNKTY
// =====================================================

function getPoints(rank) {

    const maxPoints = 250;
    const minPoints = 1;
    const maxRank =150;

    const multiplier = Math.pow(
        minPoints / maxPoints,
        1 / (maxRank - 1)
    );

    return Math.round(
        maxPoints * Math.pow(
            multiplier,
            rank - 1
        )
    );
}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =====================================================
// LEADERBOARD
// =====================================================

async function loadLeaderboard() {

    const container =
        document.getElementById(
            "leaderboard-list"
        );


    try {

        // =================================================
        // WCZYTUJEMY PLAYERS.JSON + LEVELS.JSON
        // =================================================

        const [
            playersResponse,
            levelsResponse
        ] = await Promise.all([

            fetch(PLAYERS_URL, {
                cache: "no-cache"
            }),

            fetch(LEVELS_URL, {
                cache: "no-cache"
            })

        ]);


        if (!playersResponse.ok) {
            throw new Error(
                "Nie można wczytać players.json"
            );
        }


        if (!levelsResponse.ok) {
            throw new Error(
                "Nie można wczytać levels.json"
            );
        }


        const players =
            await playersResponse.json();


        const levels =
            await levelsResponse.json();


        if (!Array.isArray(players)) {
            throw new Error(
                "players.json musi zawierać tablicę"
            );
        }


        if (!Array.isArray(levels)) {
            throw new Error(
                "levels.json musi zawierać tablicę"
            );
        }


        // =================================================
        // TWORZYMY MAPĘ DEMON -> RANK
        // =================================================

        const demonMap = {};


        levels
            .slice(0,150
            )
            .forEach((level, index) => {

                const rank =
                    index + 1;


                if (!level.name) {
                    return;
                }


                const name =
                    String(level.name)
                        .trim()
                        .toLowerCase();


                demonMap[name] =
                    rank;

            });


        console.log(
            "Demony z levels.json:",
            demonMap
        );


        // =================================================
        // LICZENIE PLAYERÓW
        // =================================================

        const leaderboard =
            players.map(player => {

                let totalPoints = 0;

                let completed = 0;

                let bestRank = Infinity;

                let top10 = 0;

                let top25 = 0;

                let top50 = 0;


                // -----------------------------------------
                // DEMONY GRACZA
                // -----------------------------------------

                const playerDemons =
                    Array.isArray(player.Demons)
                        ? player.Demons
                        : [];


                playerDemons.forEach(
                    demonName => {

                        if (!demonName) {
                            return;
                        }


                        const key =
                            String(demonName)
                                .trim()
                                .toLowerCase();


                        const rank =
                            demonMap[key];


                        // ---------------------------------
                        // DEMON NIE JEST NA LIŚCIE
                        // ---------------------------------

                        if (!rank) {

                            console.warn(
                                `Nie znaleziono "${demonName}" w levels.json`
                            );

                            return;

                        }


                        // ---------------------------------
                        // PUNKTY
                        // ---------------------------------

                        const points =
                            getPoints(rank);


                        totalPoints += points;

                        completed++;


                        // ---------------------------------
                        // BEST
                        // ---------------------------------

                        if (rank < bestRank) {

                            bestRank =
                                rank;

                        }


                        // ---------------------------------
                        // TOP 10
                        // ---------------------------------

                        if (rank <= 10) {

                            top10++;

                        }


                        // ---------------------------------
                        // TOP 25
                        // ---------------------------------

                        if (rank <= 25) {

                            top25++;

                        }


                        // ---------------------------------
                        // TOP 50
                        // ---------------------------------

                        if (rank <= 50) {

                            top50++;

                        }

                    }
                );


                return {

                    name:
                        String(
                            player.Player || ""
                        ),

                    points:
                        totalPoints,

                    completed:
                        completed,

                    bestRank:
                        bestRank === Infinity
                            ? "-"
                            : bestRank,

                    top10:
                        top10,

                    top25:
                        top25,

                    top50:
                        top50

                };

            });


        // =================================================
        // SORTOWANIE
        // =================================================

        leaderboard.sort(
            (a, b) => {

                // Najpierw punkty
                if (
                    b.points !==
                    a.points
                ) {

                    return (
                        b.points -
                        a.points
                    );

                }


                // Potem liczba demonów
                if (
                    b.completed !==
                    a.completed
                ) {

                    return (
                        b.completed -
                        a.completed
                    );

                }


                // Na końcu najlepszy rank
                return (
                    (a.bestRank === "-"
                        ? 999
                        : a.bestRank
                    )
                    -
                    (b.bestRank === "-"
                        ? 999
                        : b.bestRank
                    )
                );

            }
        );


        // =================================================
        // WYŚWIETLANIE
        // =================================================

        container.innerHTML = "";


        leaderboard.forEach(
            (player, index) => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "leaderboard-row";


                row.innerHTML = `

                    <div class="leaderboard-position">
                        #${index + 1}
                    </div>


                    <div class="leaderboard-player">

                        <div class="player-name">
                            ${escapeHTML(player.name)}
                        </div>
                            BEST TOP ${player.bestRank}
                        </div>

                    </div>


                    <div class="leaderboard-stats">

                        <div>
                            TOP 10:
                            ${player.top10}
                        </div>

                        <div>
                            TOP 25:
                            ${player.top25}
                        </div>

                        <div>
                            TOP 50:
                            ${player.top50}
                        </div>

                    </div>


                    <div class="leaderboard-points">

                        <strong>
                            ${player.points}
                        </strong>

                        <span>
                            RK
                        </span>

                    </div>

                `;


                container.appendChild(
                    row
                );

            }
        );


        console.log(
            "Leaderboard załadowany poprawnie."
        );

    }


    catch (error) {

        console.error(
            "Błąd leaderboardu:",
            error
        );


        container.innerHTML = `

            <div class="leaderboard-loading">

                Błąd podczas ładowania leaderboardu.

                <br><br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;

    }

}


// =====================================================
// START
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadLeaderboard();

    }
);

</script>
</body>
</html>
