<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RKDL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header id="hejder">
        <p id="R1">Rodzinka</p>
        <p id="R2">Kicka</p>
        <p id="R3">Demon</p>
        <p id="R4">List</p>
    </header>
    <div class="action-links">
        <a href="leaderboard.html" class="leaderboard-button">
        🏆 LEADERBOARD
        </a>
        <a href="recently.html" id="recently-button" class="leaderboard-button recently-button">
        🕒 OSTATNIO WBITE
        </a>
        <a href="winners.html" class="leaderboard-button">
        🏆 ZWYCIĘZCY LEVELA
        </a>
    </div>

    <!-- PLAYER / DEMON SEARCH -->
<div class="search-panel">

    <div class="search-header">
        <span>🔍</span>
        SEARCH
    </div>

    <div class="search-input-wrapper">
        <input
            type="text"
            id="global-search"
            placeholder="Search player or demon..."
            autocomplete="off"
        >

        <button id="clear-search" type="button">×</button>
    </div>

    <div id="search-results"></div>

    
</div>
    
    <!-- GŁÓWNY UKŁAD -->
    <main class="layout">

        <!-- LEWA LISTA TOP 1 - TOP 150 -->
        <aside id="ranking">

            <div class="ranking-title">
                DEMON LIST
            </div>

            <div id="ranking-list">
                <!-- Lista zostanie wygenerowana przez JavaScript -->
            </div>

        </aside>


        <!-- PRAWA STRONA - DEMONY -->
        <section id="demons">

        </section>

    </main>


    <script>

const LEVELS_URL = "./levels.json";
const PLAYERS_URL = "./players.json";
const AREDL_RANKS_URL = "./aredl-ranks.json";

const THUMBNAIL_URL =
    "https://raw.githubusercontent.com/All-Rated-Extreme-Demon-List/Thumbnails/main/levels/cards";

let levels = [];
let players = [];
let aredlRanks = {};


// =====================================================
// PUNKTY
// =====================================================

function getPoints(rank) {
    const maxPoints = 250;
    const minPoints = 1;
    const maxRank = 150;

    const multiplier = Math.pow(
        minPoints / maxPoints,
        1 / (maxRank - 1)
    );

    return Math.round(
        maxPoints * Math.pow(multiplier, rank - 1)
    );
}


// =====================================================
// ŁADOWANIE LEVELS.JSON
// =====================================================

async function loadLevels() {

    const demonsContainer =
        document.getElementById("demons");

    if (!demonsContainer) {
        console.error("Nie znaleziono #demons");
        return;
    }

    try {

        const response = await fetch(LEVELS_URL, {
            cache: "no-cache"
        });

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                "levels.json musi zawierać tablicę"
            );
        }

        // Maksymalnie TOP 150
        levels = data.slice(0, 150);

        await loadAredlRanks();

        generateDemonCards();
        generateRanking();

        console.log(
            `Załadowano ${levels.length} leveli.`
        );

    } catch (error) {

        console.error(
            "Błąd podczas ładowania levels.json:",
            error
        );

        demonsContainer.innerHTML = `
            <div class="loading-error">
                Nie udało się załadować listy demonów.
                <br>
                Sprawdź, czy plik <b>levels.json</b>
                znajduje się obok tego HTML.
            </div>
        `;
    }
}


async function loadAredlRanks() {

    try {

        const response = await fetch(AREDL_RANKS_URL, {
            cache: "no-cache"
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const snapshot = await response.json();

        if (!snapshot.ranks || typeof snapshot.ranks !== "object" || Array.isArray(snapshot.ranks)) {
            throw new Error("aredl-ranks.json musi zawierać obiekt ranks");
        }

        aredlRanks = snapshot.ranks;

    } catch (error) {

        console.warn("Nie udało się załadować rankingu AREDL:", error);
        aredlRanks = {};

    }
}


// =====================================================
// GENEROWANIE KART DEMONÓW
// =====================================================

function generateDemonCards() {

    const container =
        document.getElementById("demons");

    container.innerHTML = "";

    levels.forEach((level, index) => {

        const rank = index + 1;

        const card =
            document.createElement("div");

        card.className = "demon-card";

        // top1, top2, top3...
        card.id = `top${rank}`;

        // ID levela
        card.dataset.demonId = String(level.id);


        // =============================================
        // RANK
        // =============================================

        const rankElement =
            document.createElement("div");

        rankElement.className =
            "top-number";

        const rankLabel =
            document.createElement("span");

        rankLabel.textContent =
            `TOP ${rank}`;

        rankElement.appendChild(rankLabel);

        const aredlRank =
            aredlRanks[String(level.id)];

        if (Number.isInteger(aredlRank)) {
            const aredlLink =
                document.createElement("a");

            aredlLink.className =
                "aredl-rank";

            aredlLink.href =
                `https://aredl.net/list/${level.id}`;

            aredlLink.target =
                "_blank";

            aredlLink.rel =
                "noopener noreferrer";

            aredlLink.textContent =
                `AREDL #${aredlRank}`;

            rankElement.appendChild(aredlLink);
        }


        // =============================================
        // IMAGE WRAPPER
        // =============================================

        const imageWrapper =
            document.createElement("div");

        imageWrapper.className =
            "demon-image";


        // =============================================
        // IMAGE
        // =============================================

        const image =
            document.createElement("img");

        image.src =
            `${THUMBNAIL_URL}/${level.id}.webp`;

        image.alt =
            level.name;

        image.loading =
            "lazy";


        // Jeżeli obrazka nie ma
        image.onerror = function () {

            this.onerror = null;

            this.src = "";

            this.style.display = "none";

        };


        imageWrapper.appendChild(image);


        // =============================================
        // POINTS
        // =============================================

        const points =
            document.createElement("div");

        points.className =
            "image-points";

        points.textContent =
            `${getPoints(rank)} RK`;

        imageWrapper.appendChild(points);


        // =============================================
        // NAME
        // =============================================

        const name =
            document.createElement("div");

        name.className =
            "demon-name";

        name.textContent =
            level.name;


        // =============================================
        // SKŁADANIE KARTY
        // =============================================

        card.appendChild(rankElement);

        card.appendChild(imageWrapper);

        card.appendChild(name);

        container.appendChild(card);

    });
}


// =====================================================
// GENEROWANIE LEWEJ LISTY TOP 1-150
// =====================================================

function generateRanking() {

    const rankingList =
        document.getElementById("ranking-list");

    if (!rankingList) {
        return;
    }

    rankingList.innerHTML = "";


    levels.forEach((level, index) => {

        const rank = index + 1;


        const item =
            document.createElement("a");

        item.className =
            "ranking-item";

        item.href =
            `#top${rank}`;


        // =============================================
        // TOP
        // =============================================

        const rankText =
            document.createElement("span");

        rankText.textContent =
            `TOP ${rank}`;


        // =============================================
        // POINTS
        // =============================================

        const pointsText =
            document.createElement("span");

        pointsText.className =
            "points";

        pointsText.textContent =
            `${getPoints(rank)} RK`;


        item.appendChild(rankText);

        item.appendChild(pointsText);


        // =============================================
        // CLICK
        // =============================================

        item.addEventListener(
            "click",
            function () {

                document
                    .querySelectorAll(".ranking-item")
                    .forEach(other => {
                        other.classList.remove("active");
                    });

                this.classList.add("active");

            }
        );


        rankingList.appendChild(item);

    });
}


// =====================================================
// ZNAJDŹ DEMONA PO NAZWIE
// =====================================================

function findDemonByName(name) {

    const searchName =
        String(name)
            .toLowerCase()
            .trim();


    const card =
        [...document.querySelectorAll(".demon-card")]
            .find(card => {

                const nameElement =
                    card.querySelector(".demon-name");

                if (!nameElement) {
                    return false;
                }

                return (
                    nameElement.textContent
                        .toLowerCase()
                        .trim()
                    === searchName
                );

            });


    return card || null;
}


// =====================================================
// ZNAJDŹ DEMONA PO TOP ID
// =====================================================

function findDemonById(id) {

    return document.getElementById(
        String(id)
    );
}


// =====================================================
// ZNAJDŹ RANKING DEMONA
// =====================================================

function getDemonRank(card) {

    if (!card) {
        return null;
    }

    if (!card.id.startsWith("top")) {
        return null;
    }

    return parseInt(
        card.id.replace("top", ""),
        10
    );
}


// =====================================================
// ŁADOWANIE PLAYERS.JSON
// =====================================================

async function loadPlayers() {

    try {

        const response =
            await fetch(PLAYERS_URL, {
                cache: "no-cache"
            });


        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const data =
            await response.json();


        if (!Array.isArray(data)) {
            throw new Error(
                "players.json musi zawierać tablicę"
            );
        }


        players =
            data.map(player => ({

                Player:
                    String(
                        player.Player || ""
                    ),

                tag: player.tag,
                recent: player.recent,

                Demons:
                    Array.isArray(player.Demons)
                        ? player.Demons.map(
                            demon =>
                                String(demon)
                        )
                        : []

            }));


        console.log(
            `Załadowano ${players.length} graczy.`
        );


    } catch (error) {

        console.error(
            "Błąd players.json:",
            error
        );

    }
}


// =====================================================
// POKAŻ GRACZA
// =====================================================

function showPlayer(player) {

    const searchResults =
        document.getElementById(
            "search-results"
        );


    searchResults.innerHTML = "";


    // =============================================
    // HEADER
    // =============================================

    const header =
        document.createElement("div");

    header.className =
        "search-result player-header";

    header.innerHTML = `
        <div class="search-result-main">
            <span class="search-result-type">
                PLAYER
            </span>

            <span>
                ${escapeHTML(player.Player)}
            </span>
        </div>

        <span class="search-result-points">
    ${player.Demons.reduce((total, demon) => {
        const card = findDemonById(demon) || findDemonByName(demon);
        const rank = getDemonRank(card);
        return total + (rank ? getPoints(rank) : 0);
    }, 0)} RK
</span>
    `;

    searchResults.appendChild(header);


    // =============================================
    // DEMONY GRACZA
    // =============================================

    player.Demons.forEach(demon => {

        let card = null;

        // Najpierw próbujemy top1, top2 itd.
        card = findDemonById(demon);

        // Jeżeli players.json ma nazwy zamiast top ID
        if (!card) {
            card = findDemonByName(demon);
        }


        const result =
            document.createElement("div");

        result.className =
            "search-result";


        if (card) {

            const rank =
                getDemonRank(card);


            const nameElement =
                card.querySelector(
                    ".demon-name"
                );


            const demonName =
                nameElement
                    ? nameElement.textContent
                    : demon;


            result.innerHTML = `

                <div class="search-result-main">

                    <span class="search-result-type">
                        DEMON
                    </span>

                    <span>
                        ${escapeHTML(demonName)}
                    </span>

                </div>

                <span class="search-result-points">
                    TOP ${rank}
                </span>

            `;


            result.addEventListener(
                "click",
                () => {

                    card.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });

                    searchResults.style.display =
                        "none";

                }
            );


        } else {

            result.innerHTML = `

                <div class="search-result-main">

                    <span class="search-result-type">
                        DEMON
                    </span>

                    <span>
                        ${escapeHTML(demon)}
                    </span>

                </div>

                <span class="search-result-points">
                    NOT ON LIST YET
                </span>

            `;

        }


        searchResults.appendChild(result);

    });


    searchResults.style.display =
        "block";
}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =====================================================
// SEARCH
// =====================================================

function setupSearch() {

    const searchInput =
        document.getElementById(
            "global-search"
        );

    const searchResults =
        document.getElementById(
            "search-results"
        );

    const clearSearch =
        document.getElementById(
            "clear-search"
        );


    if (
        !searchInput ||
        !searchResults
    ) {
        return;
    }


    // =============================================
    // INPUT
    // =============================================

    searchInput.addEventListener(
        "input",
        function () {

            const query =
                this.value
                    .toLowerCase()
                    .trim();


            searchResults.innerHTML = "";


            if (!query) {

                searchResults.style.display =
                    "none";

                return;

            }


            let foundSomething = false;


            // =========================================
            // PLAYERS
            // =========================================

            players.forEach(player => {

                const playerName =
                    player.Player
                        .toLowerCase();


                if (
                    playerName.includes(query)
                ) {

                    foundSomething = true;


                    const result =
                        document.createElement(
                            "div"
                        );


                    result.className =
                        "search-result";


                    result.innerHTML = `

                        <div class="search-result-main">

                            <span class="search-result-type">
                                PLAYER
                            </span>

                            <span>
                                ${escapeHTML(player.Player)}
                            </span>

                        </div>

                        <span class="search-result-points">
                            ${player.Demons.length} DEMONS
                        </span>

                    `;


                    result.addEventListener(
                        "click",
                        () => {
                            showPlayer(player);
                        }
                    );


                    searchResults.appendChild(
                        result
                    );

                }

            });


            // =========================================
            // DEMONY
            // =========================================

            document
                .querySelectorAll(".demon-card")
                .forEach(card => {

                    const nameElement =
                        card.querySelector(
                            ".demon-name"
                        );


                    if (!nameElement) {
                        return;
                    }


                    const demonName =
                        nameElement.textContent
                            .trim();


                    const nameLower =
                        demonName.toLowerCase();


                    const rank =
                        getDemonRank(card);


                    const rankLower =
                        `top ${rank}`;


                    const rankWithoutSpace =
                        `top${rank}`;


                    if (

                        nameLower.includes(query) ||

                        rankLower.includes(query) ||

                        rankWithoutSpace.includes(query) ||

                        String(rank) === query

                    ) {

                        foundSomething = true;


                        const result =
                            document.createElement(
                                "div"
                            );


                        result.className =
                            "search-result";


                        result.innerHTML = `

                            <div class="search-result-main">

                                <span class="search-result-type">
                                    DEMON
                                </span>

                                <span>
                                    ${escapeHTML(demonName)}
                                </span>

                            </div>

                            <span class="search-result-points">
                                TOP ${rank}
                            </span>

                        `;


                        result.addEventListener(
                            "click",
                            () => {

                                card.scrollIntoView({
                                    behavior: "smooth",
                                    block: "center"
                                });

                                searchResults.style.display =
                                    "none";

                            }
                        );


                        searchResults.appendChild(
                            result
                        );

                    }

                });


            // =========================================
            // BRAK WYNIKÓW
            // =========================================

            if (!foundSomething) {

                searchResults.innerHTML = `

                    <div class="search-no-results">
                        No players or demons found.
                    </div>

                `;

            }


            searchResults.style.display =
                "block";

        }
    );


    // =============================================
    // CLEAR
    // =============================================

    if (clearSearch) {

        clearSearch.addEventListener(
            "click",
            () => {

                searchInput.value = "";

                searchResults.innerHTML = "";

                searchResults.style.display =
                    "none";

                searchInput.focus();

            }
        );

    }

}


// =====================================================
// RECENTLY BEAT BUTTON
// =====================================================

function setupRecentlyButton() {

    const button = document.getElementById("recently-button");

    if (!button) {
        return;
    }

    const recentPlayer = players.find(player => {
        const tag = Array.isArray(player.tag) ? player.tag : [player.tag];
        return tag.some(value => String(value).toLowerCase() === "recent");
    });

    if (!recentPlayer || !recentPlayer.recent) {
        return;
    }

    const recentLevel = levels.find(level =>
        String(level.name).trim().toLowerCase() ===
        String(recentPlayer.recent).trim().toLowerCase()
    );

    if (recentLevel) {
        button.style.backgroundImage = `linear-gradient(rgba(0, 35, 0, 0.42), rgba(0, 20, 0, 0.78)), url("${THUMBNAIL_URL}/${recentLevel.id}.webp")`;
        button.title = `${recentPlayer.Player} recently beat ${recentLevel.name}`;
    }
}


// =====================================================
// START
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        await loadLevels();

        await loadPlayers();

        setupRecentlyButton();

        setupSearch();

    }
);

</script>
</body>
</html>
